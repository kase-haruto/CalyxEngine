name: ReleasePackage

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.2.0 or v1.2.0"
        required: true
        type: string
      prerelease:
        description: "Create the GitHub Release as a prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: release
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
            $tagName = if ($version.StartsWith("v")) { $version } else { "v$version" }
            $version = $tagName.TrimStart("v")
          } else {
            $tagName = "${{ github.ref_name }}"
            $version = $tagName.TrimStart("v")
          }

          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Release version could not be resolved."
          }

          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Release version must look like 1.2.0, 1.2.0-beta.1, or v1.2.0."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag_name=$tagName" >> $env:GITHUB_OUTPUT

      - name: Create and push release tag
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $tagName = "${{ steps.release.outputs.tag_name }}"

          git fetch --tags --force
          if (git rev-parse -q --verify "refs/tags/$tagName") {
            throw "Tag already exists: $tagName"
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a $tagName -m "CalyxEngine ${{ steps.release.outputs.version }}"
          git push origin $tagName

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag_name }}
          name: CalyxEngine ${{ steps.release.outputs.version }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          generate_release_notes: true
