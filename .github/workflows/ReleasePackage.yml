name: ReleasePackage

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v, for example 1.2.0"
        required: true
        type: string
      prerelease:
        description: "Create the GitHub Release as a prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  CONFIGURATION: Release
  PLATFORM: x64

jobs:
  package:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Resolve release metadata
        id: release
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
            $tagName = if ($version.StartsWith("v")) { $version } else { "v$version" }
            $version = $tagName.TrimStart("v")
          } else {
            $tagName = "${{ github.ref_name }}"
            $version = $tagName.TrimStart("v")
          }

          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Release version could not be resolved."
          }

          $packageFile = "CalyxEngine-$version.zip"
          $downloadUrl = "https://github.com/${{ github.repository }}/releases/download/$tagName/$packageFile"

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag_name=$tagName" >> $env:GITHUB_OUTPUT
          "package_file=$packageFile" >> $env:GITHUB_OUTPUT
          "download_url=$downloadUrl" >> $env:GITHUB_OUTPUT

      - name: Create release package
        shell: pwsh
        run: |
          .\Tool\Release\PackageRelease.cmd `
            -Version "${{ steps.release.outputs.version }}" `
            -Configuration "${{ env.CONFIGURATION }}" `
            -Platform "${{ env.PLATFORM }}" `
            -DownloadUrl "${{ steps.release.outputs.download_url }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag_name }}
          name: CalyxEngine ${{ steps.release.outputs.version }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            generated/packages/${{ steps.release.outputs.package_file }}
            generated/packages/latest.json
