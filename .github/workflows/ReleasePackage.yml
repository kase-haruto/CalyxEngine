name: ReleasePackage

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v1.0.9"
        required: true
        type: string
      prerelease:
        description: "Create the GitHub Release as a prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      SOLUTION_FILE_PATH: project/CalyxEngine.sln

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve release metadata
        id: release
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tagName = "${{ inputs.tag }}"
          } else {
            $tagName = "${{ github.ref_name }}"
          }

          if (-not $tagName.StartsWith("v")) {
            throw "Release tag must start with v, for example v1.0.9."
          }

          $version = $tagName.TrimStart("v")

          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Release version could not be resolved."
          }

          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Release version must look like 1.2.0, 1.2.0-beta.1, or v1.2.0."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag_name=$tagName" >> $env:GITHUB_OUTPUT
          "package_name=CalyxGamePackage-$tagName.zip" >> $env:GITHUB_OUTPUT

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Build Debug
        run: msbuild $env:SOLUTION_FILE_PATH /m /p:Platform=x64 /p:Configuration=Debug /p:PlatformToolset=v143

      - name: Build Develop
        run: msbuild $env:SOLUTION_FILE_PATH /m /p:Platform=x64 /p:Configuration=Develop /p:PlatformToolset=v143

      - name: Build Release
        run: msbuild $env:SOLUTION_FILE_PATH /m /p:Platform=x64 /p:Configuration=Release /p:PlatformToolset=v143

      - name: Create package
        shell: pwsh
        run: |
          ./project/Tools/PackageCalyxEngine.ps1 `
            -Version "${{ steps.release.outputs.tag_name }}" `
            -Configuration Develop `
            -OutputRoot "$env:GITHUB_WORKSPACE/generated/packages"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag_name }}
          name: CalyxEngine ${{ steps.release.outputs.version }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          generate_release_notes: true
          files: generated/packages/${{ steps.release.outputs.package_name }}
