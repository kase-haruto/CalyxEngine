name: DebugBuild
on:
  push:
    branches:
      - master
env:
  # リポジトリのルートディレクトリを起点としたソリューションファイルのパス
  SOLUTION_FILE_PATH: project/CalyxEngine.sln
  # Visual Studio の構成
  CONFIGURATION: Debug

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64
      - name: Build
        shell: pwsh
        run: msbuild $env:SOLUTION_FILE_PATH /m /p:Platform=x64 /p:Configuration=$env:CONFIGURATION /p:PlatformToolset=v143
